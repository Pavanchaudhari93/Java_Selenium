# QA environment overrides (selected with -Denv=qa)
# Values below override the base config.properties

env=qa

# QA application endpoints
app.baseUrl=https://qa.the-internet.herokuapp.com
app.loginUrl=https://qa.the-internet.herokuapp.com/login
# Point at your QA API host here; demo keeps the public jsonplaceholder API
api.baseUri=https://jsonplaceholder.typicode.com

# QA databases
db.postgres.host=qa-db.example.com
db.postgres.port=5432
db.postgres.database=qa_postgres
db.postgres.user=qa_user
db.postgres.password=qa_secret_password_placeholder

db.mysql.host=qa-mysql.example.com
db.mysql.port=3306
db.mysql.database=qa_mysql
db.mysql.user=qa_user
db.mysql.password=qa_secret_password_placeholder

db.mssql.host=qa-mssql.example.com
db.mssql.port=1433
db.mssql.database=qa_mssql
db.mssql.user=qa_sa
db.mssql.password=qa_secret_password_placeholder

db.oracle.host=qa-oracle.example.com
db.oracle.port=1521
db.oracle.service=QAORCL
db.oracle.user=qa_system
db.oracle.password=qa_secret_password_placeholder

db.mongodb.uri=mongodb://qa-mongo.example.com:27017
db.mongodb.database=qa_testdb

security.zap.url=http://qa-zap.example.com:8080
security.zap.targetUrl=http://qa-app.example.com
