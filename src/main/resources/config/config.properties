# ============================================================================
# Default / base configuration. Environment specific overrides live in
# config-<env>.properties (e.g. config-qa.properties, config-prod.properties).
#
# Precedence (highest first):
#   1. JVM system properties  (-Dkey=value, e.g. -Dbrowser=firefox)
#   2. config-<env>.properties (selected via -Denv=qa)
#   3. this file
# ============================================================================

# Environment (qa / staging / prod / dev). Override with -Denv=qa
env=qa

# ------------------- Browser / execution -------------------
# Supported browsers: chrome, firefox, edge
browser=chrome
# true/false - run browser headless
browser.headless=false

# local | grid
execution.mode=local
# Selenium Grid hub URL (used when execution.mode=grid)
grid.url=http://localhost:4444/wd/hub

# ------------------- Timeouts (seconds) -------------------
timeout.explicit=30
timeout.implicit=10
timeout.pageLoad=60
# Number of times a failed test is retried (0 disables retries)
retry.count=0

# ------------------- Application under test (UI) -------------------
app.baseUrl=https://the-internet.herokuapp.com
app.loginUrl=https://the-internet.herokuapp.com/login

# ------------------- API under test -------------------
# NOTE: reqres.in now requires authentication (401 without an API key), so the
# demo uses the free, no-auth jsonplaceholder API. Point these keys at your own
# service in real projects (per-environment overrides are in config-<env>.properties).
api.baseUri=https://jsonplaceholder.typicode.com
api.basePath=
api.contentType=application/json
api.usersEndpoint=/users
api.postsEndpoint=/posts
# Max acceptable response time in ms for response-time assertions
api.maxResponseTimeMs=5000

# ------------------- Database connections -------------------
# PostgreSQL
db.postgres.host=localhost
db.postgres.port=5432
db.postgres.database=postgres
db.postgres.user=postgres
db.postgres.password=postgres

# MySQL
db.mysql.host=localhost
db.mysql.port=3306
db.mysql.database=testdb
db.mysql.user=root
db.mysql.password=root

# MSSQL Server
db.mssql.host=localhost
db.mssql.port=1433
db.mssql.database=testdb
db.mssql.user=sa
db.mssql.password=YourStrong@Passw0rd

# Oracle (service name style, e.g. XEPDB1)
db.oracle.host=localhost
db.oracle.port=1521
db.oracle.service=ORCLCDB
db.oracle.user=system
db.oracle.password=oracle

# MongoDB
db.mongodb.uri=mongodb://localhost:27017
db.mongodb.database=testdb

# ------------------- Security (OWASP ZAP) -------------------
# ZAP must be running (typically `zap.sh -daemon -port 8080`)
security.zap.url=http://localhost:8080
security.zap.apiKey=
# Target URL to spider + actively scan (a small local/secure app recommended)
security.zap.targetUrl=http://localhost:8081
# When true, routes both UI (Selenium) and API (REST-assured) traffic through the
# ZAP proxy above so ZAP passively records every request made during normal test
# runs, in addition to the active scan driven by ZapHelper/SecurityTest. Leave false
# for everyday runs; enable per-environment (e.g. config-qa.properties) or via
# -Dsecurity.zap.proxy.enabled=true when ZAP is actually running.
security.zap.proxy.enabled=false

# ------------------- Test data -------------------
testdata.excel.file=testdata/testdata.xlsx
testdata.excel.sheet=Sheet1
testdata.csv.file=testdata/users.csv
testdata.json.file=testdata/users.json
