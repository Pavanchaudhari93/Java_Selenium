# Production environment overrides (selected with -Denv=prod)
# WARNING: NEVER commit real production credentials. Values here are placeholders.

env=prod

# Production application endpoints
app.baseUrl=https://the-internet.herokuapp.com
app.loginUrl=https://the-internet.herokuapp.com/login
# Point at your production API host here; demo keeps the public jsonplaceholder API
api.baseUri=https://jsonplaceholder.typicode.com

# Production databases (placeholder credentials - rotate externally via CI secrets)
db.postgres.host=prod-db.example.com
db.postgres.port=5432
db.postgres.database=prod_postgres
db.postgres.user=prod_ro_user
db.postgres.password=PLACEHOLDER

db.mysql.host=prod-mysql.example.com
db.mysql.port=3306
db.mysql.database=prod_mysql
db.mysql.user=prod_ro_user
db.mysql.password=PLACEHOLDER

db.mssql.host=prod-mssql.example.com
db.mssql.port=1433
db.mssql.database=prod_mssql
db.mssql.user=prod_ro_user
db.mssql.password=PLACEHOLDER

db.oracle.host=prod-oracle.example.com
db.oracle.port=1521
db.oracle.service=PRODORCL
db.oracle.user=prod_ro_user
db.oracle.password=PLACEHOLDER

db.mongodb.uri=mongodb://prod-mongo.example.com:27017
db.mongodb.database=prod_testdb

security.zap.url=http://zap.example.com:8080
security.zap.targetUrl=http://www.example.com
